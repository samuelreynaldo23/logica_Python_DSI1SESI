<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula8</title>
</head>
<body>
   
    <!--form = define um formulario 
    <input> = campo de entrada (com varios tipos : text, passaword, email, number )
    <label> = associa um texto descritivo a <input>
    <textarea> = area a texto maior 
    <select> e <option> = criam menus suspensos (dropdwns)
     <button> = botao clicavel 
    <fieldset> e <legend> = agrupam e nomeiam partes de um formulario 
    <datalist> = lista de suguestoes para <input>
    -->
    

    <h1>Formulario Completo </h1>
    <form action="enviar-dados" method="post">
        <fieldset>

            <legend>informaçoes pessoais</legend>
            <label for="nome">nome completo: </label>
            <input type="text" id = "nome" name = "nome"
            placeholder="digite seu nome" required> <br>


           <label for="email">E-mail :</label>
           <input type="email" id = "E-mail" name = "E-mail"
           placeholder="seuemail@euamosenai.com.br"
           required> <br>
           <label for="senha">senha : </label>
           <input type="password"id = "senha" name = "senha"
           required> <br>
            <label for="idade">idade : </label>
            <input type="number"id= "idade" name = "idade"
            min="18" max="99"><br>


            <label for="data-nascimento">data nascimento </label>
            <input type="date"id = "data nascimento" 
             name="data nascimento"> <br>
            <label for="genero">genero</label>
            <select name="genero" id="genero">
                <option value="masculino">masculino </option>
                <option value="feminino">feminino</option>
                <option value="outro">outro</option>
                <option value="prefiro nao dizer">prefiro nao dizer</option>
                </select>
                
        </fieldset>
        <fieldset>
            <legend> detalhes adicionais</legend>
            <label for="bio">sobre você:</label>
            <textarea  id="bio" name="bio" rows = "3"
            placeholder="fale um pouco de você....">
        </textarea>
        </fieldset>


    </form>



</body>
</html>
