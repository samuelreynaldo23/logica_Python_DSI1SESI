<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>aula13</title>
</head>
<body>
    <h1>Entendendo o display</h1>
    <p>
        O <strong>display</strong> é uma propriedade CSS que controla como um elemento é exibido na página.
    </p>
<!-- -! --- BLOCK --- -->
 <h2>1. Block</h2>
 <div class="block">caixa 1</div>
<div class="block">caixa 2</div>
<div class="block">caixa 3</div>

<!-- INLINE -->
<h2>2. Inline</h2>
<span class="inline">caixa 1</span>
<span class="inline">caixa 2</span>
<span class="inline">caixa 3</span>

<!-- INLINE-BLOCK -->
<h2>3. Inline-block</h2>
<span class="inline-block">caixa 1</span>
<span class="inline-block">caixa 2</span>
<span class="inline-block">caixa 3</span>


</body>
</html>
