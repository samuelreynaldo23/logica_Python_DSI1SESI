<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula6</title>
</head>
<body>
    <!--TABELAS-->
    <!-- 
    <table> = define a tabela 
    <thead> = define a região da cabeçalho 
    <tr> = define um linha de tabela 
       <th> = define um cabeçalho 
      <tbody> = define uma regiao do corpo 
     <td> = define uma celula 
    border = "1" = adiciona bordas na tabela
    -->
    <table border = "1">
        <thead>
            <tr>
                <th>nome</th> 
                <th>idade</th>
                <th>cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>reynaldo</td>
                <td>16</td>
                <td>guarulhos</td>
            </tr>
        </tbody>

    </table>
</body>
</html>
