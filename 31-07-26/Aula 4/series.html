<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melhores Séries</title>

    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, black, darkred, black);
            color: white;
            text-align: center;
        }

        h1{
            margin-top: 20px;
        }

        ul{
            list-style: none;
            padding: 0;
        }

        li{
            margin: 30px 0;
        }

        iframe{
            margin-top: 10px;
            border: 3px solid red;
            border-radius: 10px;
        }

        .titulo-serie{
            font-size: 35px;
            font-weight: bold;
        }

        .preto{
            color: black;
        }

        .vermelho{
            color: red;
        }
    </style>
</head>

<body>

    <h1>🎬 Melhores Séries</h1>

    <ul>

        <li>
            <h2 class="titulo-serie">
                <span class="vermelho">1 - T</span><span class="preto">e</span><span class="vermelho">e</span><span class="preto">n</span>
                <span class="vermelho">W</span><span class="preto">o</span><span class="vermelho">l</span><span class="preto">f</span>
            </h2>

            <iframe width="560" height="315"
                src="https://www.youtube.com/embed/ES3mhnBgAGM?si=q_bdIbBRaPfpL2iR"
                title="YouTube video player" allowfullscreen></iframe>
        </li>

        <li>
            <h2 class="titulo-serie">
                <span class="vermelho">2 - P</span><span class="preto">r</span><span class="vermelho">i</span><span class="preto">s</span><span class="vermelho">o</span><span class="preto">n</span>
                <span class="vermelho">B</span><span class="preto">r</span><span class="vermelho">e</span><span class="preto">a</span><span class="vermelho">k</span>
            </h2>

            <iframe width="560" height="315"
                src="https://www.youtube.com/embed/oEOMlXuTMl4?si=qEI-Zh_6AJlVIcml"
                title="YouTube video player" allowfullscreen></iframe>
        </li>

        <li>
            <h2 class="titulo-serie">
                <span class="vermelho">3 - L</span><span class="preto">a</span>
                <span class="vermelho">C</span><span class="preto">a</span><span class="vermelho">s</span><span class="preto">a</span>
                <span class="vermelho">d</span><span class="preto">e</span>
                <span class="vermelho">P</span><span class="preto">a</span><span class="vermelho">p</span><span class="preto">e</span><span class="vermelho">l</span>
            </h2>

            <iframe width="560" height="315"
                src="https://www.youtube.com/embed/VY-TETyvlrY?si=rSyV66b5cFfJEVcE"
                title="YouTube video player" allowfullscreen></iframe>
        </li>

    </ul>

</body>
</html>
